<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leaflet Map with GeoJSON Upload</title>

    <!-- Leaflet CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""
    />

    <style>
        html, body, #map {
            height: 100%;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <button id="toggle-sidebar" style="
    position: absolute;
    top: 10px;
    right: 10px;
    z-index: 1001;
    padding: 6px 10px;
    background: white;
    border: 1px solid #ccc;
    border-radius: 4px;
    cursor: pointer;
    ">
        Layers
    </button>

    <div id="sidebar" style="
        position: absolute;
        top: 50px;
        right: 10px;
        width: 220px;
        background: white;
        padding: 10px;
        z-index: 1000;
        border-radius: 6px;
        box-shadow: 0 0 5px rgba(0,0,0,0.3);
        display: none;
        font-family: Arial, sans-serif;
        font-size: 14px;
    ">
        <strong>Uploaded Layers</strong>
        <div id="layer-list" style="margin-top: 10px;"></div>
    </div>


    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.1/proj4.js"></script>
    
    
    <!-- Leaflet JS -->
    <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
    ></script>
    
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4leaflet/1.0.2/proj4leaflet.js"></script>
    
    <script src="https://unpkg.com/@ngageoint/geopackage/dist/geopackage.min.js"></script>
    
    <script src="https://unpkg.com/flatgeobuf@3.22.0/dist/flatgeobuf.min.js"></script>


    <!-- Your JavaScript -->
    <script src="script.js"></script>
</body>
</html>
